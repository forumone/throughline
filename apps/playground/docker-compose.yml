services:
  postgres:
    image: postgres:16-alpine
    container_name: throughline-playground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: throughline_playground
    ports:
      - '5433:5432'
    volumes:
      - throughline-playground-pgdata:/var/lib/postgresql/data

volumes:
  throughline-playground-pgdata:
