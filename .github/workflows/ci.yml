name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger so we can re-run CI on any branch when something prevents
  # the automatic dispatch (rare; usually only matters if RELEASE_PR_TOKEN is
  # ever revoked or scoped wrong and a release PR comes in token-less).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check vendored design-system template is in sync with reference-ds
        run: pnpm --filter @forumone/create-throughline sync-reference-ds --check

  storybook-validate:
    # Builds Storybook and validates the reference-ds manifest against the
    # generated story index so every contract's storyId resolves. Runs in
    # parallel with `verify`; adds ~45s but is the real integration test
    # for the design-system package and reference-ds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reference-ds and its workspace dependencies
        # Using turbo (not pnpm --filter) so the design-system package builds first;
        # reference-ds's contract files import from it at type-check time.
        run: pnpm turbo run build --filter=@forumone/throughline-reference-ds

      - name: Build Storybook
        run: pnpm --filter @forumone/throughline-reference-ds build-storybook

      - name: Validate manifest against Storybook index
        run: pnpm --filter @forumone/throughline-reference-ds validate
